name: C/C++ CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install openssl
          brew install boost
          brew install mongo-cxx-driver
          brew install catch2

      - name: Docker version če je sploh nameščen
        if: matrix.os == 'ubuntu-latest'
        run: ls -la

      - name: Build Docker
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -f .github/Docker/Dockerfile -t rudniki_app .

      - name: Build Docker for catch 2
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -f .github/Docker/Dockerfile.catch2-builder -t catch2-builder .

      - name: Run Docker
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --name main-app rudniki_app

      - name: Run Docker catch 2
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --name catch2-container catch2-builder

      - name: Build
        if: matrix.os == 'macos-latest'
        run: cmake -S . -B build

      - name: Compile
        if: matrix.os == 'macos-latest'
        run: cmake --build build --config Release

  uploadDocker:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4

        - name: Push to DockerHub login
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_HUB_NAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}

        - name: Build and push Docker image
          id: push
          uses: docker/build-push-action@v4
          with:
            context: .github/Docker
            file: .github/Docker/Dockerfile.catch2-builder
            push: true
            tags: ${{ secrets.DOCKER_HUB_NAME }}/rudniki_app:catch2

        - name: Build and push Docker frontend
          id: push
          uses: docker/build-push-action@v4
          with:
            context: .github/Docker
            file: .github/Docker/DockerfileFrontend
            push: true
            tags: ${{ secrets.DOCKER_HUB_NAME }}/rudniki_app:frontend

        - name: Build and push Docker backend
          id: push
          uses: docker/build-push-action@v4
          with:
            context: .github/Docker
            file: .github/Docker/DockerfileBackend
            push: true
            tags: ${{ secrets.DOCKER_HUB_NAME }}/rudniki_app:backend

